#==========================================================================
# 用途：构建 panther-x2 (RK3566) Arch Linux ARM 固件
#
# 两种模式（自动判断）：
#   A. 填写 rootfs_url → 直接用现有 rootfs 执行 rebuild（快，约 5 分钟）
#   B. 不填 rootfs_url → 先构建 rootfs 再 rebuild，同时发布 rootfs + 固件
#
# rootfs 构建方式：pacstrap 从零构建（对齐 debian 的 debootstrap）
#   - runs-on: ubuntu-latest (x86_64)
#   - 注册 aarch64 binfmt（tonistiigi/binfmt），让 x86 host 能跑 arm64 binary
#   - docker run archlinux:amd64，容器内 pacstrap 拉 ALARM aarch64 包到挂载的 /rootfs
#   - 容器内 arch-chroot 做 enable 服务、locale、timezone 等（binfmt 转译）
#   - 不装 linux 内核包（内核来自 ophub tarball）
#   - 不装 mkinitcpio（uInitrd 来自 ophub 预生成）
#   - 时间同步用 systemd-timesyncd（systemd 内置）
#   - 网络用纯 NetworkManager（无 netplan）
#==========================================================================
name: Build Arch

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "已有 rootfs tar.gz 链接（留空则自动构建 rootfs）"
        required: false
        default: ""

      arch_release:
        description: "Arch 版本标识（用于 Release 命名，ALARM 目前无版本号，仅作 tag）"
        required: false
        default: "aarch64"
        type: choice
        options:
          - aarch64

      armbian_kernel:
        description: "内核版本"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - 6.18.y
          - 6.12.y
          - 6.1.y

      armbian_fstype:
        description: "rootfs 文件系统类型"
        required: false
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs

      root_password:
        description: "root 密码（仅自建 rootfs 时生效）"
        required: false
        default: "1234"

      hostname:
        description: "主机名（仅自建 rootfs 时生效）"
        required: false
        default: "arch"

      timezone:
        description: "时区（仅自建 rootfs 时生效）"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Tokyo
          - America/New_York
          - Europe/London
          - UTC

      extra_packages:
        description: "额外安装的包，空格分隔（仅自建 rootfs 时生效）"
        required: false
        default: ""

      builder_name:
        description: "构建者签名"
        required: false
        default: "mybuilder"

env:
  TZ: UTC
  ARCH_MIRROR: "https://mirror.archlinuxarm.org"
  ROOTFS_DIR: /builder/arch-rootfs
  BOARD: panther-x2

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 初始化环境 ──────────────────────────────────────────────────
      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile

          sudo -E apt-get -y update
          sudo -E apt-get -y purge \
            azure-cli ghc* zulu* llvm* firefox google* dotnet* \
            powershell openjdk* mongodb* moby* 2>/dev/null || true
          # host 是 x86_64，pacstrap 在 docker archlinux:amd64 容器内跑
          # binfmt 用 tonistiigi/binfmt 镜像注册（docker run --privileged），
          # 不需要在 host 上装 qemu-user-static 包
          sudo -E apt-get -y install \
            parted e2fsprogs dosfstools btrfs-progs \
            u-boot-tools uuid-runtime openssl pigz \
            git curl wget xz-utils lz4 zstd pv jq rsync
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ}"

          # 写入运行时变量
          echo "ARCH_RELEASE=${{ inputs.arch_release || 'aarch64' }}" >> "${GITHUB_ENV}"
          echo "ROOT_PASSWORD=${{ inputs.root_password   || '1234' }}"  >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname         || 'arch' }}"   >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone               || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"
          echo "EXTRA_PKGS=${{ inputs.extra_packages     || '' }}"        >> "${GITHUB_ENV}"

          # 判断模式：有 rootfs_url → 跳过构建
          ROOTFS_URL="${{ inputs.rootfs_url }}"
          if [[ -n "${ROOTFS_URL}" ]]; then
            echo "BUILD_ROOTFS=false" >> "${GITHUB_ENV}"
            echo "ROOTFS_URL=${ROOTFS_URL}" >> "${GITHUB_ENV}"
            echo "▶ 模式：使用已有 rootfs → ${ROOTFS_URL}"
          else
            echo "BUILD_ROOTFS=true"  >> "${GITHUB_ENV}"
            echo "ROOTFS_URL="        >> "${GITHUB_ENV}"
            echo "▶ 模式：自建 rootfs (pacstrap via docker archlinux)"
          fi

          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 2. 合并磁盘空间 ───────────────────────────────────────────────
      - name: Create build disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}G"  /mnt/mnt.img
          sudo truncate -s "${root_size}G" /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6 /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          echo "可用空间: $(df -h /builder | tail -1 | awk '{print $4}')"

      # ── 3A. 自建 rootfs（rootfs_url 为空时执行）──────────────────────
      # pacstrap 从零构建 ALARM aarch64 rootfs（对齐 debian 的 debootstrap）
      # host 是 x86_64，docker pull archlinux:amd64（只有 amd64 manifest）
      # 用 tonistiigi/binfmt 注册 aarch64 binfmt，让容器内能 chroot 进 arm64 rootfs
      - name: Build Arch rootfs
        id: build_rootfs
        if: ${{ steps.init.outputs.status == 'success' && env.BUILD_ROOTFS == 'true' && !cancelled() }}
        run: |
          set -euo pipefail

          sudo mkdir -p "${ROOTFS_DIR}"

          # ── 注册 aarch64 binfmt ──────────────────────────────────────
          # tonistiigi/binfmt 是社区标准做法，在 host kernel 注册 binfmt_misc，
          # interpreter 自动安装到 host /usr/bin/qemu-aarch64-static。
          # 注册后 host 和所有 docker 容器都能透明运行 arm64 binary。
          echo "▶ 注册 aarch64 binfmt..."
          docker run --privileged --rm tonistiigi/binfmt --install arm64

          # ── 写 ALARM pacman.conf（host 上写，挂载进容器）──────────────
          # 指向 ALARM aarch64 仓库，Architecture=aarch64 让 pacman 下载 arm64 包
          # 多 Server 并列让 pacman 自动 failover
          echo "▶ 写 ALARM pacman.conf..."
          cat > /tmp/pacman-alarm.conf << 'PACMAN_EOF'
          [options]
          Architecture = aarch64
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          HoldPkg = pacman glibc

          [core]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [extra]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [alarm]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [aur]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
          PACMAN_EOF
          sed -i 's/^[[:space:]]*//' /tmp/pacman-alarm.conf

          # ── 写 chroot 内配置脚本（挂载进 rootfs，arch-chroot 执行）──────
          # 独立文件避免 docker bash -c 嵌套引号问题
          # ${TZ_VAL}/${HOSTNAME_VAL} 是字面量，arch-chroot 执行时 shell 展开
          # （arch-chroot 继承容器主 shell 环境，docker -e 传入的变量可见）
          sudo mkdir -p "${ROOTFS_DIR}/tmp"
          cat > /tmp/chroot-config.sh << 'CHROOT_EOF'
          #!/bin/bash
          set -e
          # 验证关键包
          for p in openssh networkmanager rsync; do
            pacman -Qi ${p} >/dev/null 2>&1 || { echo "ERROR: 关键包 ${p} 安装失败"; exit 1; }
          done
          # 卸载内核包（内核来自 ophub tarball，base 组理论上不含，但保险起见）
          pacman -Rns --noconfirm linux linux-aarch64 linux-firmware 2>/dev/null || true
          # 清缓存
          pacman -Sc --noconfirm >/dev/null 2>&1 || true
          # 时区
          ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime
          # locale
          sed -i 's/^# *\(en_US.UTF-8\)/\1/' /etc/locale.gen
          locale-gen
          echo 'LANG=en_US.UTF-8' > /etc/locale.conf
          # hostname
          echo "${HOSTNAME_VAL}" > /etc/hostname
          # SSH
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          # enable 服务
          systemctl enable sshd
          systemctl enable NetworkManager
          systemctl enable NetworkManager-dispatcher
          systemctl enable systemd-timesyncd
          systemctl enable nftables               2>/dev/null || true
          # disable 不需要的服务
          systemctl disable NetworkManager-wait-online.service 2>/dev/null || true
          systemctl disable systemd-pstore.service             2>/dev/null || true
          CHROOT_EOF
          sed -i 's/^[[:space:]]*//' /tmp/chroot-config.sh
          sudo cp /tmp/chroot-config.sh "${ROOTFS_DIR}/tmp/chroot-config.sh"
          sudo chmod +x "${ROOTFS_DIR}/tmp/chroot-config.sh"

          # ── docker run archlinux:amd64，pacstrap 从零构建 ─────────────
          # --privileged: 继承 host 的 binfmt 注册（qemu-aarch64-static）
          # 挂载 $ROOTFS_DIR:/rootfs，pacstrap 直接写到 host 目录
          # -e 传环境变量进容器，arch-chroot 继承
          echo "▶ docker pacstrap 从零构建 ALARM aarch64 rootfs..."
          docker run --rm --privileged \
            -v "${ROOTFS_DIR}:/rootfs" \
            -v /tmp/pacman-alarm.conf:/etc/pacman-alarm.conf:ro \
            -e TZ_VAL="${TZ_VAL}" \
            -e HOSTNAME_VAL="${HOSTNAME_VAL}" \
            -e EXTRA_PKGS="${EXTRA_PKGS}" \
            archlinux:amd64 bash -c '
              set -euo pipefail

              # 装 pacstrap（arch-install-scripts 包提供）
              pacman -Sy --noconfirm --needed arch-install-scripts

              # pacstrap 从零构建 arm64 rootfs
              # -K: 初始化 keyring（chroot 内跑 pacman-key，arm64 binary，binfmt 转译）
              # -C: 指定 pacman.conf（指向 ALARM aarch64 仓库）
              # Architecture=aarch64 让 pacman 下载 arm64 包
              # 不装 linux 内核包（base 组 2020 年后不含 linux，内核来自 ophub）
              # 不装 mkinitcpio（uInitrd 来自 ophub 预生成）
              # 不装 chrony（用 systemd-timesyncd，已包含在 systemd）
              pacstrap -K -C /etc/pacman-alarm.conf /rootfs \
                base \
                openssh sudo curl wget ca-certificates tzdata \
                iproute2 networkmanager \
                net-tools iputils bind \
                wireless_tools wpa_supplicant wireless-regdb \
                bash-completion htop nano nftables bc \
                uboot-tools parted \
                btrfs-progs e2fsprogs dosfstools \
                lsof file procps-ng cronie \
                rsync logrotate

              # 额外包（可选）
              if [[ -n "${EXTRA_PKGS}" ]]; then
                echo "▶ 安装额外包: ${EXTRA_PKGS}"
                pacstrap -C /etc/pacman-alarm.conf /rootfs ${EXTRA_PKGS}
              fi

              # 写 resolv.conf（chroot 内能解析 DNS）
              echo "nameserver 8.8.8.8" > /rootfs/etc/resolv.conf
              echo "nameserver 1.1.1.1" >> /rootfs/etc/resolv.conf

              # arch-chroot 执行配置脚本（arm64 binary，binfmt 转译）
              arch-chroot /rootfs /bin/bash /tmp/chroot-config.sh
            '

          # 清理 chroot 脚本
          sudo rm -f "${ROOTFS_DIR}/tmp/chroot-config.sh"

          # ── host 上做剩余文件操作（不需要 chroot）─────────────────────
          # root 密码
          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"

          # hosts
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' \
            "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hosts" > /dev/null

          # 网络（纯 NetworkManager，无 netplan）
          sudo mkdir -p "${ROOTFS_DIR}/etc/NetworkManager"
          echo 'W21haW5dCnBsdWdpbnM9aWZ1cGRvd24sa2V5ZmlsZQpkaGNwPWludGVybmFsCltpZnVwZG93bl0KbWFuYWdlZD10cnVlCg==' \
            | base64 -d | sudo tee "${ROOTFS_DIR}/etc/NetworkManager/NetworkManager.conf" > /dev/null

          # systemd 超时
          SYS_CONF="${ROOTFS_DIR}/etc/systemd/system.conf"
          [[ -f "${SYS_CONF}" ]] && {
            sudo sed -i "s|^#*DefaultTimeoutStartSec.*|DefaultTimeoutStartSec=10s|g" "${SYS_CONF}"
            sudo sed -i "s|^#*DefaultTimeoutStopSec.*|DefaultTimeoutStopSec=10s|g"   "${SYS_CONF}"
          } || true

          # ── 注入平台脚本 ──────────────────────────────────────────────
          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/arch"
          sudo mkdir -p "${ROOTFS_DIR}/etc/default"
          sudo mkdir -p "${ROOTFS_DIR}/lib/systemd/system"
          sudo mkdir -p "${ROOTFS_DIR}/usr/local/bin"

          for f in arch/arch-firstrun \
                   arch/arch-common \
                   arch/arch-hardware-optimization \
                   arch/arch-resize-filesystem \
                   arch/arch-ramlog \
                   arch/arch-zram-config; do
            sudo cp "${f}" "${ROOTFS_DIR}/usr/lib/arch/$(basename ${f})"
          done
          sudo chmod +x "${ROOTFS_DIR}/usr/lib/arch/"*

          sudo cp arch/arch-release         "${ROOTFS_DIR}/etc/arch-release"
          sudo cp arch/arch-firstrun-etc    "${ROOTFS_DIR}/etc/default/arch-firstrun"
          sudo cp arch/arch-ramlog-etc      "${ROOTFS_DIR}/etc/default/arch-ramlog"
          sudo cp arch/arch-zram-config-etc "${ROOTFS_DIR}/etc/default/arch-zram-config"
          sudo cp arch/arch-update          "${ROOTFS_DIR}/usr/local/bin/a-u"
          sudo chmod +x "${ROOTFS_DIR}/usr/local/bin/a-u"

          for f in systemd/arch-firstrun.service \
                   systemd/arch-ramlog.service \
                   systemd/arch-hardware-optimize.service \
                   systemd/arch-resize-filesystem.service \
                   systemd/arch-zram-config.service; do
            sudo cp "${f}" "${ROOTFS_DIR}/lib/systemd/system/"
          done

          # ── fstab ─────────────────────────────────────────────────────
          printf 'LABEL=ROOTFS\t/\text4\tdefaults,noatime,nodiratime,commit=600,errors=remount-ro\t0 1\n' \
            | sudo tee    "${ROOTFS_DIR}/etc/fstab" > /dev/null
          printf 'LABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n' \
            | sudo tee -a "${ROOTFS_DIR}/etc/fstab" > /dev/null

          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"

          # ── 写 /etc/os-release（rebuild 强制要求 ID= 和 VERSION_CODENAME=）─────
          # ophub rebuild 在 mount 出 rootfs 后会从 etc/os-release 读这两个字段：
          #   release_codeid   ← ^ID=...
          #   release_codename ← ^VERSION_CODENAME=...
          # 任一为空就报 "The [ etc/os-release: ... ] is invalid." 并退出。
          # 从零构建的 rootfs 默认 /etc/os-release 是符号链接 → /usr/lib/os-release，
          # Arch 是滚动发布无版本代号。写一个完整的 os-release 满足 rebuild 检查。
          echo "▶ 写 /etc/os-release（满足 rebuild 的 ID/VERSION_CODENAME 检查）..."
          sudo rm -f "${ROOTFS_DIR}/etc/os-release"
          sudo tee "${ROOTFS_DIR}/etc/os-release" > /dev/null << 'OSREL_EOF'
          NAME="Arch Linux ARM"
          ID=arch
          ID_LIKE=arch
          VERSION_CODENAME=rolling
          VERSION_ID=rolling
          PRETTY_NAME="Arch Linux ARM"
          ANSI_COLOR="38;2;23;147;209"
          HOME_URL="https://archlinuxarm.org/"
          DOCUMENTATION_URL="https://archlinuxarm.org/wiki"
          SUPPORT_URL="https://archlinuxarm.org/forum"
          BUG_REPORT_URL="https://github.com/archlinuxarm/PKGBUILDs/issues"
          OSREL_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/os-release"
          sudo cp "${ROOTFS_DIR}/etc/os-release" "${ROOTFS_DIR}/usr/lib/os-release"

          echo "▶ /etc/os-release 内容:"
          cat "${ROOTFS_DIR}/etc/os-release"

          echo "▶ rootfs 完成: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 3B. 打包 rootfs tar.gz（仅自建模式）─────────────────────────
      - name: Package rootfs
        id: package_rootfs
        if: ${{ env.BUILD_ROOTFS == 'true' && steps.build_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"

          TARBALL="Arch_${ARCH_RELEASE}_rootfs.tar.gz"
          echo "▶ 打包 → ${TARBALL} ..."
          sudo tar -czf "${OUT_DIR}/${TARBALL}" -C "${ROOTFS_DIR}" .
          echo "▶ 大小: $(du -sh ${OUT_DIR}/${TARBALL} | awk '{print $1}')"

          cd "${OUT_DIR}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

          BUILT_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "TARBALL=${TARBALL}"       >> "${GITHUB_OUTPUT}"
          echo "OUT_DIR=${OUT_DIR}"       >> "${GITHUB_OUTPUT}"
          echo "BUILT_DATE=${BUILT_DATE}" >> "${GITHUB_OUTPUT}"
          echo "status=success"           >> "${GITHUB_OUTPUT}"

      # ── 3C. 下载已有 rootfs（填写 rootfs_url 时执行）────────────────
      - name: Download existing rootfs
        id: download_rootfs
        if: ${{ env.BUILD_ROOTFS == 'false' && steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          sudo mkdir -p "${ROOTFS_DIR}"
          echo "▶ 下载 rootfs: ${ROOTFS_URL}"
          wget -q --show-progress -O /tmp/rootfs.tar.gz "${ROOTFS_URL}"
          echo "▶ 解压..."
          sudo tar -xf /tmp/rootfs.tar.gz -C "${ROOTFS_DIR}"
          rm -f /tmp/rootfs.tar.gz
          [[ -d "${ROOTFS_DIR}/etc" ]] || { echo "::error::rootfs 结构非法"; exit 1; }
          echo "▶ 解压完成: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 4. 将 rootfs 打包成 Armbian 格式 img ─────────────────────────
      - name: Pack rootfs into Armbian-format image
        id: pack
        if: >-
          ${{
            !cancelled() && (
              (env.BUILD_ROOTFS == 'true'  && steps.build_rootfs.outputs.status == 'success') ||
              (env.BUILD_ROOTFS == 'false' && steps.download_rootfs.outputs.status == 'success')
            )
          }}
        run: |
          set -euo pipefail

          REBUILD_DIR="${GITHUB_WORKSPACE}/rebuild"
          IMG_DIR="${REBUILD_DIR}/build/output/images"
          mkdir -p "${IMG_DIR}"

          IMG_NAME="Armbian_22.02.0-trunk_${ARCH_RELEASE}_arm64.img"
          IMG_PATH="${IMG_DIR}/${IMG_NAME}"

          ROOTFS_MB=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          IMG_MB=$((ROOTFS_MB + 512 + 256))
          echo "▶ rootfs=${ROOTFS_MB}MiB → 镜像=${IMG_MB}MiB"
          sudo fallocate -l "${IMG_MB}M" "${IMG_PATH}"

          sudo parted -s "${IMG_PATH}" mklabel msdos
          sudo parted -s "${IMG_PATH}" mkpart primary ext4 4MiB 100%

          LOOP=$(sudo losetup -P -f --show "${IMG_PATH}")
          echo "▶ loop device: ${LOOP}"

          sudo mkfs.ext4 -F -q -L "ROOTFS" -b 4096 "${LOOP}p1"

          MNT=$(mktemp -d)
          sudo mount "${LOOP}p1" "${MNT}"
          echo "▶ 正在写入 rootfs..."
          sudo rsync -a "${ROOTFS_DIR}/" "${MNT}/"
          sudo sync
          sudo umount "${MNT}"
          sudo losetup -d "${LOOP}"
          rmdir "${MNT}"

          echo "▶ 镜像写入完成: $(du -sh ${IMG_PATH})"
          echo "img_path=${IMG_PATH}"  >> "${GITHUB_OUTPUT}"
          echo "img_outdir=${IMG_DIR}" >> "${GITHUB_OUTPUT}"
          echo "status=success"        >> "${GITHUB_OUTPUT}"

      # ── 5. Rebuild：注入内核 + uboot + 平台文件 ──────────────────────
      # rebuild 的 -s 参数控制新镜像分区大小：-s boot_mb/root_mb
      # 从零构建的 rootfs 约 400-600MiB（base + 基础包），动态计算 root_mb 保险
      - name: Rebuild image
        id: rebuild
        if: ${{ steps.pack.outputs.status == 'success' && !cancelled() }}
        env:
          KERNEL: ${{ inputs.armbian_kernel }}
          FSTYPE: ${{ inputs.armbian_fstype }}
          BUILDER: ${{ inputs.builder_name }}
        run: |
          set -euo pipefail
          REBUILD_DIR="${GITHUB_WORKSPACE}/rebuild"
          sudo chmod +x "${REBUILD_DIR}/rebuild"
          cd "${REBUILD_DIR}"

          # 动态计算 root_mb：rootfs 实际大小 + 内核/modules 空间 + 缓冲
          ROOTFS_ACTUAL_MB=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          ROOT_MB=$((ROOTFS_ACTUAL_MB + 512 + 256))
          BOOT_MB=256
          echo "▶ rootfs 实际: ${ROOTFS_ACTUAL_MB}MiB → rebuild -s ${BOOT_MB}/${ROOT_MB}"

          echo "▶ 执行: sudo ./rebuild -b ${BOARD} -k ${KERNEL} -a true -t ${FSTYPE} -s ${BOOT_MB}/${ROOT_MB} -r ophub/kernel -n ${BUILDER}"
          sudo ./rebuild \
            -b ${BOARD} \
            -k ${KERNEL} \
            -a true \
            -t ${FSTYPE} \
            -s ${BOOT_MB}/${ROOT_MB} \
            -r ophub/kernel \
            -n ${BUILDER}

          OUTPUT_DIR="${REBUILD_DIR}/build/output/images"
          ls -lh "${OUTPUT_DIR}/"

          PACKAGED_FILE="$(ls ${OUTPUT_DIR}/*.img.gz 2>/dev/null | head -1)"
          [[ -z "${PACKAGED_FILE}" ]] && { echo "::error::rebuild 未生成 .img.gz"; exit 1; }

          echo "PACKAGED_OUTPUTPATH=${OUTPUT_DIR}" >> "${GITHUB_ENV}"
          echo "PACKAGED_STATUS=success"           >> "${GITHUB_ENV}"

      # ── 6A. 发布固件 + rootfs（自建模式）────────────────────────────
      - name: Release firmware + rootfs
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS == 'success' && env.BUILD_ROOTFS == 'true' && !cancelled() }}
        with:
          tag: "Arch_${{ env.ARCH_RELEASE }}"
          name: "Arch ${{ env.ARCH_RELEASE }} · panther-x2"
          artifacts: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz*
            ${{ steps.package_rootfs.outputs.OUT_DIR }}/${{ steps.package_rootfs.outputs.TARBALL }}
            ${{ steps.package_rootfs.outputs.OUT_DIR }}/${{ steps.package_rootfs.outputs.TARBALL }}.sha256
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Arch ${{ env.ARCH_RELEASE }} for panther-x2 (RK3566)

            | 参数 | 值 |
            |------|-----|
            | Arch 版本 | `${{ env.ARCH_RELEASE }}` (Arch Linux ARM) |
            | 内核 | `${{ inputs.armbian_kernel }}` |
            | 文件系统 | `${{ inputs.armbian_fstype }}` |
            | 时区 | `${{ env.TZ_VAL }}` |
            | 构建时间 | `${{ steps.package_rootfs.outputs.BUILT_DATE }}` |
            | 构建编号 | `#${{ github.run_number }}` |

            ## 附件说明
            - `*.img.gz` — 可直接烧录的固件
            - `Arch_*_rootfs.tar.gz` — rootfs 归档，下次构建可填入 rootfs_url 跳过 pacstrap

            ## 复用此 rootfs
            下次触发时在 **rootfs_url** 填入：
            ```
            https://github.com/${{ github.repository }}/releases/download/Arch_${{ env.ARCH_RELEASE }}_${{ inputs.armbian_kernel }}_${{ github.run_number }}/Arch_${{ env.ARCH_RELEASE }}_rootfs.tar.gz
            ```

      # ── 6B. 仅发布固件（使用已有 rootfs 模式）───────────────────────
      - name: Release firmware only
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS == 'success' && env.BUILD_ROOTFS == 'false' && !cancelled() }}
        with:
          tag: "Arch_${{ env.ARCH_RELEASE }}"
          name: "Arch ${{ env.ARCH_RELEASE }} · panther-x2"
          artifacts: "${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz*"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Arch ${{ env.ARCH_RELEASE }} for panther-x2 (RK3566)

            | 参数 | 值 |
            |------|-----|
            | 来源 rootfs | `${{ inputs.rootfs_url }}` |
            | 内核 | `${{ inputs.armbian_kernel }}` |
            | 文件系统 | `${{ inputs.armbian_fstype }}` |
            | 构建编号 | `#${{ github.run_number }}` |
