name: Build Arch

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "已有 rootfs tar.gz 链接（留空则自动构建 rootfs）"
        required: false
        default: ""

      arch_release:
        description: "Arch 版本标识（用于 Release 命名，ALARM 目前无版本号，仅作 tag）"
        required: false
        default: "aarch64"
        type: choice
        options:
          - aarch64

      armbian_kernel:
        description: "内核版本"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - 6.18.y
          - 6.12.y
          - 6.1.y

      armbian_fstype:
        description: "rootfs 文件系统类型"
        required: false
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs

      root_password:
        description: "root 密码（仅自建 rootfs 时生效）"
        required: false
        default: "1234"

      hostname:
        description: "主机名（仅自建 rootfs 时生效）"
        required: false
        default: "arch"

      timezone:
        description: "时区（仅自建 rootfs 时生效）"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Tokyo
          - America/New_York
          - Europe/London
          - UTC

      extra_packages:
        description: "额外安装的包，空格分隔（仅自建 rootfs 时生效）"
        required: false
        default: ""

      builder_name:
        description: "构建者签名"
        required: false
        default: "mybuilder"

env:
  TZ: UTC
  ARCH_MIRROR: "https://mirror.archlinuxarm.org"
  ROOTFS_DIR: /builder/arch-rootfs
  BOARD: panther-x2

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 初始化环境 ──────────────────────────────────────────────────
      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile

          sudo -E apt-get -y update
          sudo -E apt-get -y purge \
            azure-cli ghc* zulu* llvm* firefox google* dotnet* \
            powershell openjdk* mongodb* moby* 2>/dev/null || true
          # arch-chroot 来自 arch-install-scripts（host 是 arm64，arch-chroot arm64 rootfs 原生无需 binfmt）
          # bsdtar 来自 libarchive-tools（解压 ALARM tarball 必需，保留 capability xattr）
          sudo -E apt-get -y install \
            parted e2fsprogs dosfstools btrfs-progs \
            u-boot-tools uuid-runtime openssl pigz \
            git curl wget xz-utils lz4 zstd pv jq rsync \
            arch-install-scripts libarchive-tools
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ}"

          # 写入运行时变量
          echo "ARCH_RELEASE=${{ inputs.arch_release || 'aarch64' }}" >> "${GITHUB_ENV}"
          echo "ROOT_PASSWORD=${{ inputs.root_password   || '1234' }}"  >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname         || 'arch' }}"   >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone               || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"
          echo "EXTRA_PKGS=${{ inputs.extra_packages     || '' }}"        >> "${GITHUB_ENV}"

          # 判断模式：有 rootfs_url → 跳过构建
          ROOTFS_URL="${{ inputs.rootfs_url }}"
          if [[ -n "${ROOTFS_URL}" ]]; then
            echo "BUILD_ROOTFS=false" >> "${GITHUB_ENV}"
            echo "ROOTFS_URL=${ROOTFS_URL}" >> "${GITHUB_ENV}"
            echo "▶ 模式：使用已有 rootfs → ${ROOTFS_URL}"
          else
            echo "BUILD_ROOTFS=true"  >> "${GITHUB_ENV}"
            echo "ROOTFS_URL="        >> "${GITHUB_ENV}"
            echo "▶ 模式：自建 rootfs (ALARM tarball + arch-chroot + 精简)"
          fi

          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 2. 合并磁盘空间 ───────────────────────────────────────────────
      - name: Create build disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}G"  /mnt/mnt.img
          sudo truncate -s "${root_size}G" /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6 /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          echo "可用空间: $(df -h /builder | tail -1 | awk '{print $4}')"

      # ── 3A. 自建 rootfs（rootfs_url 为空时执行）──────────────────────
      # 下载 ALARM 官方 aarch64 rootfs tarball，arch-chroot 进去装包 + 精简
      # ubuntu-24.04-arm 是 arm64 host + ALARM aarch64 rootfs，arch-chroot 原生无需 binfmt
      - name: Build Arch rootfs
        id: build_rootfs
        if: ${{ steps.init.outputs.status == 'success' && env.BUILD_ROOTFS == 'true' && !cancelled() }}
        run: |
          set -euo pipefail

          sudo mkdir -p "${ROOTFS_DIR}"

          # ── chroot helper ──────────────────────────────────────────────
          # 不用 arch-chroot：它内部 `mount --bind $rootfs $rootfs + --make-private`，
          # 会让 pacman 在 chroot 内找不到 cachedir 挂载点，报：
          #   "could not determine cachedir mount point /var/cache/pacman/pkg/..."
          #   "failed to commit transaction (not enough free disk space)"
          # 改成手动 mount proc/sys/dev/devpts/run，不 bind rootfs 到自身。
          mount_chroot() {
              sudo mount -t proc     proc     "${ROOTFS_DIR}/proc"
              sudo mount -t sysfs    sysfs    "${ROOTFS_DIR}/sys"
              sudo mount --bind      /dev     "${ROOTFS_DIR}/dev"
              sudo mount --bind      /dev/pts "${ROOTFS_DIR}/dev/pts"
              sudo mount -t tmpfs    tmpfs    "${ROOTFS_DIR}/run"
          }
          umount_chroot() {
              sudo umount -R "${ROOTFS_DIR}/run"      2>/dev/null || true
              sudo umount -R "${ROOTFS_DIR}/dev/pts"  2>/dev/null || true
              sudo umount -R "${ROOTFS_DIR}/dev"      2>/dev/null || true
              sudo umount -R "${ROOTFS_DIR}/sys"      2>/dev/null || true
              sudo umount -R "${ROOTFS_DIR}/proc"     2>/dev/null || true
          }
          trap umount_chroot EXIT

          # ── 下载 ALARM 官方 aarch64 rootfs tarball ───────────────────
          # GitHub runner 在国外（美东/美西），国内镜像（TUNA 等）DNS 解析不到。
          # 用国外镜像优先，多镜像 fallback：
          #   1. fl.us.mirror.archlinuxarm.org  — 美国迈阿密 (ALARM 官方)
          #   2. mirror.archlinuxarm.org        — 官方 GeoIP 重定向
          #   3. os.archlinuxarm.org            — 官方 os 子域
          #   4. mirrors.tuna.tsinghua.edu.cn   — 清华 TUNA（备用，万一回国）
          # 注意：mirrors.kernel.org 不含 archlinuxarm 镜像（404），勿用
          ALARM_MIRRORS=(
            "https://fl.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "https://mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz"
          )

          downloaded=0
          for url in "${ALARM_MIRRORS[@]}"; do
            echo "▶ 尝试下载: ${url}"
            # --tries=3: 重试 3 次；--timeout=30: 单次 30s 超时；-c: 断点续传
            if wget -q --show-progress --tries=3 --timeout=30 -c -O /tmp/alarm-rootfs.tar.gz "${url}"; then
              downloaded=1
              echo "▶ 下载成功: ${url}"
              break
            fi
            echo "::warning::下载失败: ${url}，尝试下一个镜像"
          done
          [[ "${downloaded}" -eq "1" ]] || { echo "::error::所有 ALARM 镜像均下载失败"; exit 1; }
          echo "▶ 大小: $(du -sh /tmp/alarm-rootfs.tar.gz | awk '{print $1}')"

          # ── 解压：必须用 bsdtar（来自 libarchive-tools）─────────────
          # GNU tar 不认识 LIBARCHIVE.xattr.security.capability，会丢 capability
          # （ping 等程序会受影响）。ALARM 官方文档明确要求用 bsdtar。
          echo "▶ 确保 bsdtar 可用..."
          command -v bsdtar || { echo "::error::bsdtar 安装失败"; exit 1; }

          echo "▶ 解压到 ${ROOTFS_DIR} (bsdtar -xpf 保留 capability xattr)..."
          sudo bsdtar -xpf /tmp/alarm-rootfs.tar.gz -C "${ROOTFS_DIR}"
          rm -f /tmp/alarm-rootfs.tar.gz
          echo "▶ 解压完成: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"

          # ── 配置 rootfs 的 resolv.conf，确保 chroot 内能解析 DNS ──
          # host (ubuntu runner) 的 /etc/resolv.conf 通常是 systemd-resolved 的 stub
          # (nameserver 127.0.0.53)，chroot 内没有 systemd-resolved 在跑，127.0.0.53:53 是死的，
          # 会导致 pacman "Could not resolve host"。直接写真实公共 DNS 最稳。
          echo "▶ host /etc/resolv.conf 内容（仅供诊断）:"
          cat /etc/resolv.conf || true

          echo "▶ 覆盖 rootfs /etc/resolv.conf → 公共 DNS..."
          sudo tee "${ROOTFS_DIR}/etc/resolv.conf" > /dev/null << 'RESOLV_EOF'
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          nameserver 1.1.1.1
          nameserver 2606:4700:4700::1111
          RESOLV_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/resolv.conf"

          # 注：实际系统启动后 systemd-resolved / NetworkManager 会重写 /etc/resolv.conf，
          # 这里的公共 DNS 只在构建期 chroot 内生效，不影响最终系统行为。

          # ── 覆盖 pacman.conf，每个仓库配多个 Server（pacman 自动 failover）──
          # ALARM rootfs 自带的 pacman.conf 指向 mirror.archlinuxarm.org（GeoIP 重定向）。
          # GitHub runner 在国外，国外镜像可达性最好。多 Server 并列让 pacman 自动切换。
          # 顺序：美东/美西 → 官方 GeoIP → 欧洲 → 国内（兜底）
          echo "▶ 覆盖 /etc/pacman.conf → 多国外镜像..."
          sudo tee "${ROOTFS_DIR}/etc/pacman.conf" > /dev/null << 'PACMAN_EOF'
          [options]
          Architecture = aarch64
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          HoldPkg = pacman glibc

          [core]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [extra]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [alarm]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [aur]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
          PACMAN_EOF
          # 去掉 heredoc 缩进（上面为可读性缩进了 10 空格）
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/pacman.conf"

          echo "▶ pacman.conf 内容:"
          grep -E '^(Server|Architecture|\[)' "${ROOTFS_DIR}/etc/pacman.conf"

          # ── 初始化 keyring ───────────────────────────────────────────
          echo "▶ mount chroot 挂载点..."
          mount_chroot

          echo "▶ 精简前 rootfs: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"

          echo "▶ 初始化 pacman keyring..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set -e
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Sy --noconfirm
          "
          
          echo "▶ 卸载 ALARM 预装、但用不到的包..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set -e

            verify_removed() {
              local failed=0
              for p in \"\$@\"; do
                if pacman -Qi \"\${p}\" >/dev/null 2>&1; then
                  echo \"  ⚠ 卸载未生效: \${p}（可能被其他包依赖，见下方 pacman 输出）\"
                  failed=1
                fi
              done
              return \${failed}
            }

            echo '  → 卸载 firmware 包...'
            pacman -Rns --noconfirm \
              linux-firmware \
              linux-firmware-whence \
              linux-firmware-intel \
              linux-firmware-nvidia \
              linux-firmware-atheros \
              linux-firmware-amdgpu \
              linux-firmware-other \
              linux-firmware-mediatek \
              linux-firmware-realtek \
              linux-firmware-broadcom \
              linux-firmware-cirrus \
              linux-firmware-radeon
            verify_removed linux-firmware linux-firmware-intel linux-firmware-nvidia

            echo '  → 卸载内核包...'
            pacman -Rns --noconfirm \
              linux-aarch64
            verify_removed linux-aarch64 mkinitcpio mkinitcpio-busybox

            echo '  → 卸载 netctl/dhcpcd...'
            pacman -Rns --noconfirm \
              netctl \
              dhcpcd
            verify_removed netctl dhcpcd

            echo '  → 卸载 ex-vi-compat（vim 的依赖方，必须先卸）...'
            pacman -Rns --noconfirm ex-vi-compat
            verify_removed ex-vi-compat verify_removed vim vim-runtime

            echo '  → 卸载 pciutils / gpm...'
            pacman -Rns --noconfirm \
              pciutils
            verify_removed pciutils gpm

            echo '  → 清理孤儿包...'
            orphans=\$(pacman -Qdtq 2>/dev/null || true)
            [[ -n \"\${orphans}\" ]] && pacman -Rns --noconfirm \${orphans} || true
          "

          echo "▶ 卸载不需要的包后 rootfs: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "▶ 安装需要的基础包..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set -e
            pacman -Sy --noconfirm --needed \
              openssh sudo curl wget ca-certificates tzdata \
              iproute2 networkmanager \
              net-tools iputils bind \
              wireless_tools wpa_supplicant wireless-regdb \
              bash-completion htop nano nftables bc \
              uboot-tools parted \
              btrfs-progs e2fsprogs dosfstools \
              lsof file procps-ng cronie \
              rsync logrotate

            # 验证关键包
            for p in openssh networkmanager rsync; do
              pacman -Qi \${p} >/dev/null 2>&1 || { echo \"ERROR: 关键包 \${p} 安装失败\"; exit 1; }
            done
          "

          echo "▶ 执行 pacman -Syu 全量更新..."
          sudo chroot "${ROOTFS_DIR}" pacman -Syu --noconfirm --needed
          
          echo "▶ 收尾清理..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set -e
            echo '  → 清 pacman 包缓存...'
            pacman -Sc --noconfirm >/dev/null 2>&1 || true
            # 清掉所有下载的包文件（/var/cache/pacman/pkg/*.pkg.tar.*）
            rm -rf /var/cache/pacman/pkg/*
            # 清 pacman 操作日志（不影响运行，运行时重新生成）
            rm -f /var/log/pacman.log

            echo '  → 清空日志...'
            # 保留目录结构，清空文件内容
            find /var/log -type f -exec truncate -s 0 {} \; 2>/dev/null || true
            # 删除 journald 日志（运行时重新生成）
            rm -rf /var/log/journal/*

            echo '  → 删除文档/man/info...'
            rm -rf /usr/share/doc/*
            rm -rf /usr/share/man/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/gtk-doc/*
            rm -rf /usr/share/readline/*

            echo '  → 精简 locale（只留 en_US、zh_CN、zh_TW）...'
            # 删除非需要的 locale 文件
            find /usr/share/locale -type f \
              ! -name 'en_US*' ! -name 'zh_CN*' ! -name 'zh_TW*' \
              ! -name 'locale.alias' \
              -delete 2>/dev/null || true
            # 删除空的 locale 目录
            find /usr/share/locale -type d -empty -delete 2>/dev/null || true

            echo '  → 清理 root 家目录残留与临时文件...'
            rm -rf /root/.cache /root/.bash_history
            rm -rf /tmp/* /var/tmp/*
            rm -rf /var/lib/pacman/sync/*
          "
          echo "▶ 最终 rootfs: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"

          echo "▶ 最终体积构成 Top 20 (/usr 下，便于后续继续瘦身)..."
          sudo du -h --max-depth=3 "${ROOTFS_DIR}/usr" 2>/dev/null | sort -rh | head -20 || true

          # ── 时区 / locale / hostname ──────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime
          sudo chroot "${ROOTFS_DIR}" bash -c "
            sed -i 's/^# *\(en_US.UTF-8\)/\1/' /etc/locale.gen
            locale-gen

            # 验证 locale 确实生成成功，生成失败要显式报错而不是静默过去
            locale -a | grep -qi 'en_US.utf8' || { echo 'ERROR: en_US.UTF-8 locale 生成失败'; exit 1; }

            echo 'LANG=en_US.UTF-8' > /etc/locale.conf
          "

          echo "▶ 清理 locale-gen 用剩的 i18n 源文件..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            find /usr/share/i18n -type f \
              ! -name 'C*' ! -name 'POSIX*' ! -name 'i18n*' \
              -delete 2>/dev/null || true
            find /usr/share/i18n -type d -empty -delete 2>/dev/null || true
          "


          echo "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hostname" > /dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' \
            "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hosts" > /dev/null

          # ── SSH ───────────────────────────────────────────────────────
          # Arch 默认 sshd_config 已基本可用，仅开启 PermitRootLogin yes 和 PasswordAuthentication yes
          sudo mkdir -p -m 0755 "${ROOTFS_DIR}/var/run/sshd" 2>/dev/null || \
            sudo mkdir -p -m 0755 "${ROOTFS_DIR}/run/sshd"
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/'             "${ROOTFS_DIR}/etc/ssh/sshd_config"
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "${ROOTFS_DIR}/etc/ssh/sshd_config"

          # ── root 密码 ─────────────────────────────────────────────────
          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"

          # ── 网络（纯 NetworkManager，无 netplan）──────────────────────
          sudo mkdir -p "${ROOTFS_DIR}/etc/NetworkManager"
          echo 'W21haW5dCnBsdWdpbnM9aWZ1cGRvd24sa2V5ZmlsZQpkaGNwPWludGVybmFsCltpZnVwZG93bl0KbWFuYWdlZD10cnVlCg==' \
            | base64 -d | sudo tee "${ROOTFS_DIR}/etc/NetworkManager/NetworkManager.conf" > /dev/null

          # ── systemd 超时 ──────────────────────────────────────────────
          SYS_CONF="${ROOTFS_DIR}/etc/systemd/system.conf"
          [[ -f "${SYS_CONF}" ]] && {
            sudo sed -i "s|^#*DefaultTimeoutStartSec.*|DefaultTimeoutStartSec=10s|g" "${SYS_CONF}"
            sudo sed -i "s|^#*DefaultTimeoutStopSec.*|DefaultTimeoutStopSec=10s|g"   "${SYS_CONF}"
          } || true

          # ── 注入平台脚本 ──────────────────────────────────────────────
          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/arch"
          sudo mkdir -p "${ROOTFS_DIR}/etc/default"
          sudo mkdir -p "${ROOTFS_DIR}/lib/systemd/system"
          sudo mkdir -p "${ROOTFS_DIR}/usr/local/bin"

          for f in arch/arch-firstrun \
                   arch/arch-common \
                   arch/arch-hardware-optimization \
                   arch/arch-resize-filesystem \
                   arch/arch-ramlog \
                   arch/arch-zram-config; do
            sudo cp "${f}" "${ROOTFS_DIR}/usr/lib/arch/$(basename ${f})"
          done
          sudo chmod +x "${ROOTFS_DIR}/usr/lib/arch/"*

          sudo cp arch/arch-release         "${ROOTFS_DIR}/etc/arch-release"
          sudo cp arch/arch-firstrun-etc    "${ROOTFS_DIR}/etc/default/arch-firstrun"
          sudo cp arch/arch-ramlog-etc      "${ROOTFS_DIR}/etc/default/arch-ramlog"
          sudo cp arch/arch-zram-config-etc "${ROOTFS_DIR}/etc/default/arch-zram-config"
          sudo cp arch/arch-update          "${ROOTFS_DIR}/usr/local/bin/a-u"
          sudo chmod +x "${ROOTFS_DIR}/usr/local/bin/a-u"

          for f in systemd/arch-firstrun.service \
                   systemd/arch-ramlog.service \
                   systemd/arch-hardware-optimize.service \
                   systemd/arch-resize-filesystem.service \
                   systemd/arch-zram-config.service; do
            sudo cp "${f}" "${ROOTFS_DIR}/lib/systemd/system/"
          done

          # ── enable 服务（在 chroot 内用 systemctl，需要 proc/sys/dev 已 mount）──
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable NetworkManager-dispatcher
            systemctl enable systemd-timesyncd
            systemctl enable nftables               2>/dev/null || true
            systemctl enable arch-firstrun.service
            systemctl enable arch-ramlog.service
            systemctl enable arch-hardware-optimize.service
            systemctl enable arch-resize-filesystem.service
            systemctl enable arch-zram-config.service

            # disable 不需要的服务
            systemctl disable NetworkManager-wait-online.service 2>/dev/null || true
            systemctl disable systemd-pstore.service             2>/dev/null || true
          "

          # ── 卸载 chroot 挂载点 ────────────────────────────────────────
          umount_chroot
          trap - EXIT

          # ── 恢复 pacman.conf 为面向最终用户的配置 ────────────────────
          # 关键：前面覆盖的多国外镜像列表（fl.us/de/fr.mirror.archlinuxarm.org +
          # tuna）是专门为 GitHub Actions 的境外网络环境优化的构建期配置，
          # 目的是让 pacstrap/pacman -S 在 CI 里下载够快够稳。
          # 但这份配置如果原封不动打进最终镜像，会带来两个问题：
          #   1. 部分镜像证书或线路本身不稳定（如实测 de/fr 证书不匹配、
          #      tuna 返回 403），只是 CI 阶段用 Server 列表做了 failover
          #      掩盖过去，用户实际使用时会直接暴露这些问题
          #   2. 即使镜像本身没问题，"境外优先"的顺序对国内网络环境的用户
          #      来说也是绕远路，micro-blocked / phillips too slow 之类的
          #      超时很常见（用户实测 fl.us 镜像 "Operation too slow"）
          # 打包前换回 ALARM 官方标准做法：只写单一的 GeoIP 重定向域名
          # mirror.archlinuxarm.org，配合 pacman-mirrorlist 包，不管用户在
          # 哪个国家/地区，DNS 都会自动解析到地理位置最近的官方镜像节点，
          # 不需要在这里猜测最终用户的网络环境。
          echo "▶ 恢复 /etc/pacman.conf → 面向最终用户的官方 GeoIP 镜像..."
          sudo tee "${ROOTFS_DIR}/etc/pacman.conf" > /dev/null << 'PACMAN_USER_EOF'
          [options]
          Architecture = aarch64
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          HoldPkg = pacman glibc

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [alarm]
          Include = /etc/pacman.d/mirrorlist

          [aur]
          Include = /etc/pacman.d/mirrorlist
          PACMAN_USER_EOF
          # 去掉 heredoc 缩进（上面为可读性缩进了 10 空格）
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/pacman.conf"

          # 写标准 mirrorlist（GeoIP 重定向域名，pacman-mirrorlist 包本身
          # 也提供这份文件，这里显式写一份确保内容可控、不依赖包内容版本）
          sudo mkdir -p "${ROOTFS_DIR}/etc/pacman.d"
          printf 'Server = http://mirror.archlinuxarm.org/$arch/$repo\n' \
            | sudo tee "${ROOTFS_DIR}/etc/pacman.d/mirrorlist" > /dev/null

          echo "▶ 最终 pacman.conf 内容:"
          cat "${ROOTFS_DIR}/etc/pacman.conf"

          # ── fstab ─────────────────────────────────────────────────────
          printf 'LABEL=ROOTFS\t/\text4\tdefaults,noatime,nodiratime,commit=600,errors=remount-ro\t0 1\n' \
            | sudo tee    "${ROOTFS_DIR}/etc/fstab" > /dev/null
          printf 'LABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n' \
            | sudo tee -a "${ROOTFS_DIR}/etc/fstab" > /dev/null

          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"

          # ── 写 /etc/os-release（rebuild 强制要求 ID= 和 VERSION_CODENAME=）─────
          # ophub rebuild 在 mount 出 rootfs 后会从 etc/os-release 读这两个字段：
          #   release_codeid   ← ^ID=...
          #   release_codename ← ^VERSION_CODENAME=...
          # 任一为空就报 "The [ etc/os-release: ... ] is invalid." 并退出。
          # ALARM rootfs 默认 /etc/os-release 是符号链接 → /usr/lib/os-release，
          # 且内容没有 VERSION_CODENAME（Arch 是滚动发布，无版本代号）。
          # Debian/Ubuntu rootfs 自带 VERSION_CODENAME=bookworm/noble 所以能过。
          # 这里写一个完整的 os-release，覆盖符号链接，满足 rebuild 检查。
          echo "▶ 写 /etc/os-release（满足 rebuild 的 ID/VERSION_CODENAME 检查）..."
          sudo rm -f "${ROOTFS_DIR}/etc/os-release"
          sudo tee "${ROOTFS_DIR}/etc/os-release" > /dev/null << 'OSREL_EOF'
          NAME="Arch Linux ARM"
          ID=arch
          ID_LIKE=arch
          VERSION_CODENAME=rolling
          VERSION_ID=rolling
          PRETTY_NAME="Arch Linux ARM"
          ANSI_COLOR="38;2;23;147;209"
          HOME_URL="https://archlinuxarm.org/"
          DOCUMENTATION_URL="https://archlinuxarm.org/wiki"
          SUPPORT_URL="https://archlinuxarm.org/forum"
          BUG_REPORT_URL="https://github.com/archlinuxarm/PKGBUILDs/issues"
          OSREL_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/os-release"
          # 同步覆盖 /usr/lib/os-release（避免符号链接残留导致不一致）
          sudo cp "${ROOTFS_DIR}/etc/os-release" "${ROOTFS_DIR}/usr/lib/os-release"

          echo "▶ /etc/os-release 内容:"
          cat "${ROOTFS_DIR}/etc/os-release"

          echo "▶ rootfs 最终大小: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 3B. 打包 rootfs tar.gz（仅自建模式）─────────────────────────
      - name: Package rootfs
        id: package_rootfs
        if: ${{ env.BUILD_ROOTFS == 'true' && steps.build_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"

          TARBALL="Arch_${ARCH_RELEASE}_rootfs.tar.gz"
          echo "▶ 打包 → ${TARBALL} ..."
          sudo tar -czf "${OUT_DIR}/${TARBALL}" -C "${ROOTFS_DIR}" .
          echo "▶ 大小: $(du -sh ${OUT_DIR}/${TARBALL} | awk '{print $1}')"

          cd "${OUT_DIR}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

          BUILT_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "TARBALL=${TARBALL}"       >> "${GITHUB_OUTPUT}"
          echo "OUT_DIR=${OUT_DIR}"       >> "${GITHUB_OUTPUT}"
          echo "BUILT_DATE=${BUILT_DATE}" >> "${GITHUB_OUTPUT}"
          echo "status=success"           >> "${GITHUB_OUTPUT}"

      # ── 3C. 下载已有 rootfs（填写 rootfs_url 时执行）────────────────
      - name: Download existing rootfs
        id: download_rootfs
        if: ${{ env.BUILD_ROOTFS == 'false' && steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          sudo mkdir -p "${ROOTFS_DIR}"
          echo "▶ 下载 rootfs: ${ROOTFS_URL}"
          wget -q --show-progress -O /tmp/rootfs.tar.gz "${ROOTFS_URL}"
          echo "▶ 解压..."
          sudo tar -xf /tmp/rootfs.tar.gz -C "${ROOTFS_DIR}"
          rm -f /tmp/rootfs.tar.gz
          [[ -d "${ROOTFS_DIR}/etc" ]] || { echo "::error::rootfs 结构非法"; exit 1; }
          echo "▶ 解压完成: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 4. 将 rootfs 打包成 Armbian 格式 img ─────────────────────────
      - name: Pack rootfs into Armbian-format image
        id: pack
        if: >-
          ${{
            !cancelled() && (
              (env.BUILD_ROOTFS == 'true'  && steps.build_rootfs.outputs.status == 'success') ||
              (env.BUILD_ROOTFS == 'false' && steps.download_rootfs.outputs.status == 'success')
            )
          }}
        run: |
          set -euo pipefail

          REBUILD_DIR="${GITHUB_WORKSPACE}/rebuild"
          IMG_DIR="${REBUILD_DIR}/build/output/images"
          mkdir -p "${IMG_DIR}"

          IMG_NAME="Armbian_22.02.0-trunk_${ARCH_RELEASE}_arm64.img"
          IMG_PATH="${IMG_DIR}/${IMG_NAME}"

          ROOTFS_MB=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          IMG_MB=$((ROOTFS_MB + 512 + 256))
          echo "▶ rootfs=${ROOTFS_MB}MiB → 镜像=${IMG_MB}MiB"
          sudo fallocate -l "${IMG_MB}M" "${IMG_PATH}"

          sudo parted -s "${IMG_PATH}" mklabel msdos
          sudo parted -s "${IMG_PATH}" mkpart primary ext4 4MiB 100%

          LOOP=$(sudo losetup -P -f --show "${IMG_PATH}")
          echo "▶ loop device: ${LOOP}"

          sudo mkfs.ext4 -F -q -L "ROOTFS" -b 4096 "${LOOP}p1"

          MNT=$(mktemp -d)
          sudo mount "${LOOP}p1" "${MNT}"
          echo "▶ 正在写入 rootfs..."
          sudo rsync -a "${ROOTFS_DIR}/" "${MNT}/"
          sudo sync
          sudo umount "${MNT}"
          sudo losetup -d "${LOOP}"
          rmdir "${MNT}"

          echo "▶ 镜像写入完成: $(du -sh ${IMG_PATH})"
          echo "img_path=${IMG_PATH}"  >> "${GITHUB_OUTPUT}"
          echo "img_outdir=${IMG_DIR}" >> "${GITHUB_OUTPUT}"
          echo "status=success"        >> "${GITHUB_OUTPUT}"

      # ── 5. Rebuild：注入内核 + uboot + 平台文件 ──────────────────────
      # rebuild 的 -s 参数控制新镜像分区大小：-s boot_mb/root_mb
      # 精简后 rootfs 实测稳定在 800MiB-1GiB，与 debian（256/1024 固定值）
      # 量级相当，改回固定值：256(boot)/1280(root)。
      # root 比 debian 的 1024 多留 256MiB 余量，覆盖 pacman 更新缓存、
      # 日志增长、用户后续 pacman -S 装包等场景；固定值也让镜像大小
      # 可预期，不必每次都用 du 重新计算。
      # 若后续 rootfs 体积有较大变化（比如加了很多 extra_packages），
      # 再手动调整这两个数字即可。
      - name: Rebuild image
        id: rebuild
        if: ${{ steps.pack.outputs.status == 'success' && !cancelled() }}
        env:
          KERNEL: ${{ inputs.armbian_kernel }}
          FSTYPE: ${{ inputs.armbian_fstype }}
          BUILDER: ${{ inputs.builder_name }}
        run: |
          set -euo pipefail
          REBUILD_DIR="${GITHUB_WORKSPACE}/rebuild"
          sudo chmod +x "${REBUILD_DIR}/rebuild"
          cd "${REBUILD_DIR}"

          echo "▶ 执行: sudo ./rebuild -b ${BOARD} -k ${KERNEL} -a true -t ${FSTYPE} -s 256/1024 -r ophub/kernel -n ${BUILDER}"
          sudo ./rebuild \
            -b ${BOARD} \
            -k ${KERNEL} \
            -a true \
            -t ${FSTYPE} \
            -s 256/1280 \
            -r ophub/kernel \
            -n ${BUILDER}

          OUTPUT_DIR="${REBUILD_DIR}/build/output/images"
          ls -lh "${OUTPUT_DIR}/"

          PACKAGED_FILE="$(ls ${OUTPUT_DIR}/*.img.gz 2>/dev/null | head -1)"
          [[ -z "${PACKAGED_FILE}" ]] && { echo "::error::rebuild 未生成 .img.gz"; exit 1; }

          echo "PACKAGED_OUTPUTPATH=${OUTPUT_DIR}" >> "${GITHUB_ENV}"
          echo "PACKAGED_STATUS=success"           >> "${GITHUB_ENV}"

      # ── 6A. 发布固件 + rootfs（自建模式）────────────────────────────
      - name: Release firmware + rootfs
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS == 'success' && env.BUILD_ROOTFS == 'true' && !cancelled() }}
        with:
          tag: "Arch_${{ env.ARCH_RELEASE }}"
          name: "Arch ${{ env.ARCH_RELEASE }} · panther-x2"
          artifacts: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz*
            ${{ steps.package_rootfs.outputs.OUT_DIR }}/${{ steps.package_rootfs.outputs.TARBALL }}
            ${{ steps.package_rootfs.outputs.OUT_DIR }}/${{ steps.package_rootfs.outputs.TARBALL }}.sha256
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Arch ${{ env.ARCH_RELEASE }} for panther-x2 (RK3566)

            | 参数 | 值 |
            |------|-----|
            | Arch 版本 | `${{ env.ARCH_RELEASE }}` (Arch Linux ARM) |
            | 内核 | `${{ inputs.armbian_kernel }}` |
            | 文件系统 | `${{ inputs.armbian_fstype }}` |
            | 时区 | `${{ env.TZ_VAL }}` |
            | 构建时间 | `${{ steps.package_rootfs.outputs.BUILT_DATE }}` |
            | 构建编号 | `#${{ github.run_number }}` |

            ## 附件说明
            - `*.img.gz` — 可直接烧录的固件
            - `Arch_*_rootfs.tar.gz` — rootfs 归档，下次构建可填入 rootfs_url 跳过 pacstrap

            ## 复用此 rootfs
            下次触发时在 **rootfs_url** 填入：
            ```
            https://github.com/${{ github.repository }}/releases/download/Arch_${{ env.ARCH_RELEASE }}_${{ inputs.armbian_kernel }}_${{ github.run_number }}/Arch_${{ env.ARCH_RELEASE }}_rootfs.tar.gz
            ```

      # ── 6B. 仅发布固件（使用已有 rootfs 模式）───────────────────────
      - name: Release firmware only
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS == 'success' && env.BUILD_ROOTFS == 'false' && !cancelled() }}
        with:
          tag: "Arch_${{ env.ARCH_RELEASE }}"
          name: "Arch ${{ env.ARCH_RELEASE }} · panther-x2"
          artifacts: "${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz*"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Arch ${{ env.ARCH_RELEASE }} for panther-x2 (RK3566)

            | 参数 | 值 |
            |------|-----|
            | 来源 rootfs | `${{ inputs.rootfs_url }}` |
            | 内核 | `${{ inputs.armbian_kernel }}` |
            | 文件系统 | `${{ inputs.armbian_fstype }}` |
            | 构建编号 | `#${{ github.run_number }}` |
